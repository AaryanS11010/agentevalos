# Snowflake CLI native app project definition.
# Deploy locally with: snow app run   (from within snowflake-native-app/)
# Package + publish with: snow app version create

definition_version: "2"

entities:
  agentevalos_app_pkg:
    type: application package
    identifier: agentevalos_pkg
    manifest: manifest.yml
    artifacts:
      - src: app/*
        dest: ./
      - src: setup_script.sql
        dest: ./
      - src: README.md
        dest: ./
    stage_subdirectory: app_src

  agentevalos_app:
    type: application
    identifier: agentevalos_app
    from:
      target: agentevalos_app_pkg
