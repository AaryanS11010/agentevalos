manifest_version: 1

version:
  name: V1
  label: "1.0.0"
  comment: "AgentEvalOS industry benchmark scoring, packaged to run entirely inside the consumer's Snowflake account"

artifacts:
  setup_script: setup_script.sql
  readme: README.md
  default_streamlit: app/streamlit_app.py

privileges:
  - CREATE COMPUTE POOL:
      description: "Run the benchmark scoring stored procedure on Snowpark-optimized warehouses"
  - CREATE WAREHOUSE:
      description: "Provision a dedicated warehouse for benchmark scoring jobs"

references: []
