name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [packages/agentevalos-sdk, services/agent-orchestrator, services/eval-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.service }}" != "packages/agentevalos-sdk" ]; then
            pip install -e ../../packages/agentevalos-sdk
          fi
          pip install -e ".[dev]"
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: pip install ruff && ruff check .
      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest -q

  console-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check -recursive
