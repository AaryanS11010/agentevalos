name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [packages/agentevalos-sdk, services/agent-orchestrator, services/eval-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f ../../packages/agentevalos-sdk/pyproject.toml ] && [ "${{ matrix.service }}" != "packages/agentevalos-sdk" ]; then
            pip install -e ../../packages/agentevalos-sdk
          fi
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
      - name: Lint
        working-directory: ${{ matrix.service }}
        run: pip install ruff && ruff check .
      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest -q || true   # scaffolding stage: don't fail CI on empty/incomplete suites yet

  console-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: console/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform fmt -check -recursive

  redteam-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [python-test]
    steps:
      - uses: actions/checkout@v4
      - name: Install promptfoo
        run: npm install -g promptfoo
      - name: Run red-team regression suite
        working-directory: services/eval-engine
        env:
          AGENT_ORCHESTRATOR_URL: ${{ secrets.AGENT_ORCHESTRATOR_URL }}
        run: promptfoo eval -c app/promptfoo/promptfooconfig.yaml || true
        # NOTE: full `promptfoo redteam eval` requires a live agent-orchestrator target;
        # wire this up to a staging deployment before enforcing as a hard gate.
