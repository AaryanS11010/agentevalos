version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentevalos}
      POSTGRES_USER: ${POSTGRES_USER:-agentevalos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentevalos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentevalos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - phoenix

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # UI
      - "4317"        # phoenix also accepts OTLP directly

  agent-orchestrator:
    build:
      context: .
      dockerfile: services/agent-orchestrator/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentevalos}:${POSTGRES_PASSWORD:-agentevalos}@postgres:5432/${POSTGRES_DB:-agentevalos}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      EVAL_ENGINE_URL: http://eval-engine:8002
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  eval-engine:
    build:
      context: .
      dockerfile: services/eval-engine/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentevalos}:${POSTGRES_PASSWORD:-agentevalos}@postgres:5432/${POSTGRES_DB:-agentevalos}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
