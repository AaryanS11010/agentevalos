[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "FastAPI + LangGraph service that runs durable, MCP-tool-using agent workflows"
requires-python = ">=3.11"
dependencies = [
    # installed editable by bootstrap.sh and CI first (not on PyPI)
    "agentevalos-sdk",
    # Snowflake Cortex Agents client (preview)
    "snowflake-cortex-agent-sdk>=0.0.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.20",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # snowflake_tools.py runs as its own subprocess and imports this
    "snowflake-connector-python>=3.10",
    "pyyaml>=6.0",
    # mcp 2.x removed the decorator API that snowflake_tools.py uses
    "mcp>=1.2.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.ruff.lint]
# B008: Depends() in a default argument is FastAPI's documented pattern
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
