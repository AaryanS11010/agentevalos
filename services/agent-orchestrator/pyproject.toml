[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "FastAPI + LangGraph service that runs durable, MCP-tool-using agent workflows"
requires-python = ">=3.11"
dependencies = [
    # agentevalos-sdk is a local monorepo package, not on PyPI, and pip rejects a
    # relative file:// URL here (non-portable across checkout locations anyway) —
    # it's installed editable as a separate step by scripts/bootstrap.sh and CI
    # before this package, so a plain name requirement resolves against it.
    "agentevalos-sdk",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.20",
    "langchain-core>=0.3",
    "langgraph-checkpoint-postgres>=1.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    # app/mcp/snowflake_tools.py runs inside this service's own venv (it's spawned
    # as a subprocess by the MCP client, not imported from eval-engine) and imports
    # snowflake.connector directly.
    "snowflake-connector-python>=3.10",
    "pyyaml>=6.0",
    # mcp 2.x removed the @server.list_tools()/@server.call_tool() decorator API that
    # app/mcp/snowflake_tools.py is built on (replaced with add_request_handler); pin
    # to the 1.x line until that's ported.
    "mcp>=1.2.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
