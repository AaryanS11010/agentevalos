[project]
name = "eval-engine"
version = "0.1.0"
description = "DeepEval/Promptfoo-driven evals, industry-specific evaluators, and tabular model benchmarking against Snowflake datasets"
requires-python = ">=3.11"
dependencies = [
    # installed editable by bootstrap.sh and CI first (not on PyPI)
    "agentevalos-sdk",
    # Snowflake Cortex Agents client (preview)
    "snowflake-cortex-agent-sdk>=0.0.3",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # the [pandas] extra is needed by write_pandas (it pulls in pyarrow)
    "snowflake-connector-python[pandas]>=3.10",
    "snowflake-snowpark-python>=1.20",
    "deepeval>=1.1",
    # DeepEval's judge backends import these
    "anthropic>=0.34",
    "openai>=1.40",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
