apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentevalos

resources:
  - namespace.yaml
  - postgres.yaml
  - otel-collector.yaml
  - agent-orchestrator.yaml
  - eval-engine.yaml
  - console.yaml

configMapGenerator:
  - name: agentevalos-config
    literals:
      - EVAL_ENGINE_URL=http://eval-engine:8002
      - AGENT_ORCHESTRATOR_URL=http://agent-orchestrator:8001
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - NEXT_PUBLIC_ORCHESTRATOR_URL=http://agent-orchestrator:8001
      - NEXT_PUBLIC_EVAL_ENGINE_URL=http://eval-engine:8002
