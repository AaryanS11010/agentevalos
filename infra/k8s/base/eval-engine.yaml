apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-engine
  namespace: agentevalos
spec:
  replicas: 1
  selector:
    matchLabels: { app: eval-engine }
  template:
    metadata:
      labels: { app: eval-engine }
    spec:
      containers:
        - name: eval-engine
          image: ghcr.io/agentevalos/eval-engine:latest
          ports: [{ containerPort: 8002 }]
          envFrom:
            - secretRef: { name: agentevalos-secrets }
            - configMapRef: { name: agentevalos-config }
          readinessProbe:
            httpGet: { path: /healthz, port: 8002 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: eval-engine
  namespace: agentevalos
spec:
  selector: { app: eval-engine }
  ports: [{ port: 8002, targetPort: 8002 }]
