apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: agentevalos
spec:
  replicas: 2
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: ghcr.io/agentevalos/console:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: agentevalos-config }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: agentevalos
spec:
  selector: { app: console }
  ports: [{ port: 3000, targetPort: 3000 }]
  type: LoadBalancer
