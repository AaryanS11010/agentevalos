apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentevalos-dev

resources:
  - ../../base

replicas:
  - name: agent-orchestrator
    count: 1
  - name: eval-engine
    count: 1
  - name: console
    count: 1

secretGenerator:
  - name: agentevalos-secrets
    envs:
      - .env.dev.secrets   # not committed — copy from .env.dev.secrets.example and fill in
