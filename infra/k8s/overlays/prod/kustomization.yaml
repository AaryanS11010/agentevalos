apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentevalos-prod

resources:
  - ../../base

replicas:
  - name: agent-orchestrator
    count: 3
  - name: eval-engine
    count: 3
  - name: console
    count: 2

secretGenerator:
  - name: agentevalos-secrets
    envs:
      - .env.prod.secrets   # not committed — copy from .env.prod.secrets.example and fill in (or use a secrets manager, e.g. external-secrets)
